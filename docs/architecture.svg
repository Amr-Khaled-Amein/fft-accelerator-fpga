<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="470" viewBox="0 0 1100 470" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e07b00"/>
    </marker>
  </defs>
  <rect width="1100" height="470" fill="#ffffff"/>

  <!-- pc -->
  <rect x="20" y="180" width="120" height="90" rx="4" fill="#eef4fb" stroke="#4c78a8" stroke-width="1.5"/>
  <text x="80" y="212" text-anchor="middle" font-weight="bold">PC</text>
  <text x="80" y="232" text-anchor="middle" font-size="12">fft_uart.py</text>
  <text x="80" y="250" text-anchor="middle" font-size="11" fill="#555">numpy + model</text>

  <!-- uart -->
  <g fill="#f7f7f7" stroke="#444" stroke-width="1.3">
    <rect x="200" y="115" width="120" height="44" rx="3"/>
    <rect x="200" y="291" width="120" height="44" rx="3"/>
  </g>
  <text x="260" y="142" text-anchor="middle">uart_rx</text>
  <text x="260" y="318" text-anchor="middle">uart_tx</text>
  <text x="170" y="96" text-anchor="middle" font-size="11" fill="#555">115200 baud, onboard USB-UART</text>
  <g stroke="#333" stroke-width="1.5" fill="none">
    <path d="M80,180 L80,137 L198,137" marker-end="url(#a)"/>
    <path d="M198,313 L80,313 L80,272" marker-end="url(#a)"/>
    <path d="M320,137 L368,137" marker-end="url(#a)"/>
    <path d="M368,313 L322,313" marker-end="url(#a)"/>
  </g>
  <text x="112" y="130" font-size="11" fill="#555">'F' + 256 samples</text>
  <text x="40" y="352" font-size="11" fill="#555">A5 5A, 256 bins, cycles,</text>
  <text x="40" y="366" font-size="11" fill="#555">flags, checksum</text>

  <!-- control -->
  <rect x="370" y="95" width="160" height="260" rx="4" fill="#f7f7f7" stroke="#444" stroke-width="1.3"/>
  <text x="450" y="120" text-anchor="middle" font-weight="bold">control (top.v)</text>
  <g font-size="11.5" fill="#333">
    <text x="382" y="148">wait for 'F'</text>
    <text x="382" y="168">4 bytes -> 1 sample</text>
    <text x="382" y="188">pulse start</text>
    <text x="382" y="208">count busy clocks</text>
    <text x="382" y="228">read bins 0..255</text>
    <text x="382" y="248">send reply + checksum</text>
    <text x="382" y="268">frame stops halfway</text>
    <text x="392" y="284">-> timeout, error led</text>
  </g>
  <rect x="390" y="380" width="120" height="36" rx="3" fill="#fff8ee" stroke="#e07b00" stroke-width="1.3"/>
  <text x="450" y="403" text-anchor="middle" font-size="12">6 leds</text>
  <path d="M450,355 L450,378" stroke="#e07b00" stroke-width="1.5" marker-end="url(#ao)"/>

  <!-- core outline -->
  <rect x="570" y="30" width="515" height="420" rx="6" fill="none" stroke="#4c78a8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="586" y="52" font-weight="bold" fill="#4c78a8">fft_core  (N = 256, W = 16, both are parameters)</text>

  <g stroke="#333" stroke-width="1.5" fill="none">
    <path d="M530,165 L568,165" marker-end="url(#a)"/>
    <path d="M568,290 L532,290" marker-end="url(#a)"/>
  </g>
  <text x="534" y="157" font-size="10.5" fill="#555">load,</text>
  <text x="534" y="182" font-size="10.5" fill="#555">start</text>
  <text x="534" y="282" font-size="10.5" fill="#555">bins,</text>
  <text x="534" y="307" font-size="10.5" fill="#555">done</text>

  <!-- address gen -->
  <rect x="590" y="70" width="190" height="150" rx="3" fill="#f7f7f7" stroke="#444" stroke-width="1.3"/>
  <text x="685" y="92" text-anchor="middle" font-weight="bold">address gen</text>
  <g font-size="11.5" fill="#333">
    <text x="600" y="114">stage 0..7, bf 0..127</text>
    <text x="600" y="134">a = bf with a 0 put in at bit</text>
    <text x="612" y="149">'stage', b = a + 2^stage</text>
    <text x="600" y="169">k = (bf mod 2^stage) &lt;&lt; (7-stage)</text>
    <text x="600" y="189">bank = xor of the address bits</text>
    <text x="600" y="209">load: bit reversed address</text>
  </g>

  <!-- twiddle rom -->
  <rect x="590" y="270" width="190" height="76" rx="3" fill="#eef4fb" stroke="#4c78a8" stroke-width="1.3"/>
  <text x="685" y="292" text-anchor="middle" font-weight="bold">twiddle ROM (pROM)</text>
  <text x="685" y="312" text-anchor="middle" font-size="11.5">128 x {cos, sin}, 16 bit</text>
  <text x="685" y="332" text-anchor="middle" font-size="11" fill="#555">made by gen_twiddle.py</text>
  <path d="M685,220 L685,268" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="692" y="250" font-size="11" fill="#555">k</text>

  <!-- banks -->
  <g fill="#f0f7ee" stroke="#54a24b" stroke-width="1.3">
    <rect x="840" y="70" width="150" height="58" rx="3"/>
    <rect x="840" y="150" width="150" height="58" rx="3"/>
  </g>
  <text x="915" y="94" text-anchor="middle" font-weight="bold">bank 0 (BSRAM)</text>
  <text x="915" y="114" text-anchor="middle" font-size="11.5">128 x {re, im}</text>
  <text x="915" y="174" text-anchor="middle" font-weight="bold">bank 1 (BSRAM)</text>
  <text x="915" y="194" text-anchor="middle" font-size="11.5">128 x {re, im}</text>
  <g stroke="#333" stroke-width="1.5" fill="none">
    <path d="M780,99 L838,99" marker-end="url(#a)"/>
    <path d="M780,179 L838,179" marker-end="url(#a)"/>
  </g>
  <text x="788" y="92" font-size="10.5" fill="#555">rd addr</text>
  <text x="788" y="172" font-size="10.5" fill="#555">rd addr</text>

  <!-- butterfly -->
  <rect x="840" y="270" width="225" height="150" rx="3" fill="#fff8ee" stroke="#e07b00" stroke-width="1.5"/>
  <text x="952" y="294" text-anchor="middle" font-weight="bold">butterfly</text>
  <g font-size="11.5" fill="#333">
    <text x="852" y="316">s1  t = b * (c - js)</text>
    <text x="852" y="336">s2  a + t,  a - t</text>
    <text x="852" y="356">s3  round, /2, clip to 16 bit</text>
    <text x="852" y="380" fill="#555">2 DSP (MULTADDALU18X18)</text>
    <text x="852" y="400" fill="#555">1 butterfly per clock</text>
  </g>
  <g stroke="#333" stroke-width="1.5" fill="none">
    <path d="M900,208 L900,268" marker-end="url(#a)"/>
    <path d="M780,308 L838,308" marker-end="url(#a)"/>
  </g>
  <text x="906" y="244" font-size="11" fill="#555">a, b</text>
  <text x="790" y="301" font-size="11" fill="#555">c, s</text>

  <!-- write back -->
  <g stroke="#e07b00" stroke-width="1.5" fill="none">
    <path d="M1065,300 L1075,300 L1075,105 L992,105" marker-end="url(#ao)"/>
    <path d="M1075,185 L992,185" marker-end="url(#ao)"/>
  </g>
  <text x="1000" y="240" font-size="11" fill="#b36200">write back</text>
  <text x="1000" y="254" font-size="11" fill="#b36200">in place</text>
</svg>
